[project]
name = "aws-lighthouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.56",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.16",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.9",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.scripts]
aws-lighthouse = "aws_lighthouse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_lighthouse"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["E501"]  # line-length enforced by formatter, not linter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is idiomatic in pytest

[tool.mypy]
ignore_missing_imports = true

