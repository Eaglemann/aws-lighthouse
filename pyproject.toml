[project]
name = "aws-lighthouse"
version = "0.1.1"
description = "Terminal-first FinOps, Security, and Cloud Infrastructure Agent for AWS"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AWS Lighthouse Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.56",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.16",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.9",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/your-org/aws-lighthouse"
Repository = "https://github.com/your-org/aws-lighthouse"
Issues = "https://github.com/your-org/aws-lighthouse/issues"
Changelog = "https://github.com/your-org/aws-lighthouse/blob/main/CHANGELOG.md"

[project.scripts]
aws-lighthouse = "aws_lighthouse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_lighthouse"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip-audit>=2.9.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "--cov=aws_lighthouse --cov-fail-under=70"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["E501"]  # line-length enforced by formatter, not linter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is idiomatic in pytest

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Modules that still need full annotation work — tracked as follow-up tasks.
# New modules must be fully annotated; adding to this list requires a justification.
module = [
    "aws_lighthouse.auth",
    "aws_lighthouse.tools.mcp_client",
    "aws_lighthouse.tools.security_scan",
    "aws_lighthouse.tools.ri_sp_coverage",
    "aws_lighthouse.tools.iam_scan",
    "aws_lighthouse.tools.cost_scan",
    "aws_lighthouse.tools.cloudwatch_scan",
    "aws_lighthouse.agent",
]
disallow_untyped_defs = false

