name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Lint with Ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with mypy
      run: |
        uv run mypy aws_lighthouse

    - name: Test with pytest
      run: |
        uv run pytest

  test-matrix:
    # Run tests across Python versions and operating systems.
    # macOS has a different symlink layout (/etc -> /private/etc) that affects
    # bash.py path blocking; Ubuntu validates standard Linux paths.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        exclude:
          # ubuntu/3.12 already covered by lint-and-test above
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Test with pytest
      run: |
        uv run pytest

  build-check:
    # Verify the wheel builds cleanly and is installable in a fresh venv.
    # Catches broken pyproject.toml metadata, missing __init__.py, and
    # entry-point wiring errors before they reach the release workflow.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: ".python-version"

    - name: Build wheel
      run: uv build

    - name: Install wheel in a clean venv and smoke-test entry point
      run: |
        uv venv .venv-check
        uv pip install dist/*.whl --python .venv-check/bin/python
        .venv-check/bin/aws-lighthouse --help

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version-file: ".python-version"

    - name: Dependency audit
      run: ./scripts/dependency-audit.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Gitleaks
      run: |
        set -euo pipefail
        curl -sSfL -o /tmp/gitleaks.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz
        echo "2f92ab3b8e08319ac30836c32b90818e01519c3a4982771e4f45a7f5607872f7  /tmp/gitleaks.tar.gz" \
          | sha256sum --check --strict
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

    - name: Scan for secrets with Gitleaks
      run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --verbose
