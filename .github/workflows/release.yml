name: Release

# Triggered when a semver tag is pushed, e.g. v1.2.3
# Workflow:
#   1. Run full test suite (same as CI) to gate the release.
#   2. Generate per-release changelog with git-cliff.
#   3. Build sdist + wheel with uv build (backed by hatchling).
#   4. Publish to PyPI via OIDC trusted publisher (no long-lived secret needed).
#      Configure at: https://pypi.org/manage/account/publishing/
#   5. Create a GitHub Release with the changelog and built artifacts.
#
# Version bumping: run `uv version --bump minor` (or patch/major) locally,
# commit, then `git tag v$(uv version --short) && git push --tags`.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # create GitHub Release + upload assets
  id-token: write   # OIDC token for PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history required by git-cliff
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy aws_lighthouse

      - name: Test
        run: uv run pytest

      - name: Dependency audit
        run: ./scripts/dependency-audit.sh

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(uv version --short)"

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz
          echo "2f92ab3b8e08319ac30836c32b90818e01519c3a4982771e4f45a7f5607872f7  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets with Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --verbose

      # Install git-cliff to generate release notes and verify the downloaded
      # binary against upstream SHA256 checksums before executing it.
      - name: Install git-cliff (verified)
        run: |
          set -euo pipefail
          CLIFF_VERSION="2.12.0"
          CLIFF_ASSET="git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          CLIFF_BASE_URL="https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}"
          CLIFF_SHA_FILE="${CLIFF_ASSET}.sha512"

          curl -sSfL "${CLIFF_BASE_URL}/${CLIFF_ASSET}" -o "/tmp/${CLIFF_ASSET}"
          curl -sSfL "${CLIFF_BASE_URL}/${CLIFF_SHA_FILE}" -o "/tmp/${CLIFF_SHA_FILE}"

          (cd /tmp && sha512sum -c "${CLIFF_SHA_FILE}")

          CLIFF_EXTRACT_DIR="/tmp/git-cliff-${CLIFF_VERSION}"
          rm -rf "${CLIFF_EXTRACT_DIR}"
          mkdir -p "${CLIFF_EXTRACT_DIR}"
          tar -xzf "/tmp/${CLIFF_ASSET}" -C "${CLIFF_EXTRACT_DIR}"

          CLIFF_BIN="$(find "${CLIFF_EXTRACT_DIR}" -type f -name git-cliff -print -quit)"
          if [ -z "${CLIFF_BIN}" ]; then
            echo "git-cliff binary not found after extraction."
            find "${CLIFF_EXTRACT_DIR}" -maxdepth 3 -type f | sort
            exit 1
          fi

          chmod +x "${CLIFF_BIN}"
          echo "$(dirname "${CLIFF_BIN}")" >> "${GITHUB_PATH}"

      - name: Generate release notes
        run: git cliff --current --strip header --output RELEASE_NOTES.md

      - name: Build distribution packages
        run: uv build

      - name: Smoke-test built wheel
        run: |
          uv venv .venv-release-check
          uv pip install dist/*.whl --python .venv-release-check/bin/python
          .venv-release-check/bin/aws-lighthouse --help

      # Requires a PyPI trusted publisher configured for this repository.
      # No PYPI_TOKEN secret needed when OIDC is set up.
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
