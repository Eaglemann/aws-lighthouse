        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref LighthouseDataProtectionPolicy
        - !Ref LighthouseCustomReadPolicy

  # IAM Role: Lighthouse Read Role (Management Account)
  # Read-only cross-account role for cost analysis and monitoring
  LighthouseReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "LighthouseReadRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      Description: "Read-only role for Lighthouse cost analysis and monitoring. Must remain in place for Lighthouse to function correctly. Email support@aws-lighthouse.local for assistance."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{LIGHTHOUSE_ACCOUNT_ID}}:role/LighthouseCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": "{{EXTERNAL_ID}}"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{LIGHTHOUSE_ACCOUNT_ID}}:role/LighthouseCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        # Additional AWS managed policies not covered by ViewOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref LighthouseDataProtectionPolicy
        - !Ref LighthouseCustomReadPolicy

  # IAM Role: LighthouseAgent Read Role
  # Read-only AI role for cost analysis and monitoring
  LighthouseAgentReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "LighthouseAgentReadRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      Description: "Read-only AI role for Lighthouse cost analysis and monitoring. Must remain in place for LighthouseAgent to function correctly."
      MaxSessionDuration: 3600
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: CostOptimization
        - Key: RoleType
          Value: AI-ReadOnly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{LIGHTHOUSE_ACCOUNT_ID}}:role/LighthouseCustomerAccessRole"
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                "sts:ExternalId": "{{EXTERNAL_ID}}"
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::{{LIGHTHOUSE_ACCOUNT_ID}}:role/LighthouseCustomerAccessRole"
            Action:
              - sts:TagSession
      ManagedPolicyArns:
        # Read permissions - using AWS managed policies for broad coverage
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
        # Additional AWS managed policies not covered by ViewOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSSavingsPlansReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ComputeOptimizerReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Ref LighthouseDataProtectionPolicy
        - !Ref LighthouseCustomReadPolicy

  LighthouseOptimizationNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "LighthouseOptimizationNotifierRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Lighthouse to notify about deployment events. Must remain in place for Lighthouse to function correctly. Email support@aws-lighthouse.local for assistance."
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: EventNotification
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToLighthouseSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: "arn:aws:sqs:us-east-1:{{LIGHTHOUSE_ACCOUNT_ID}}:Lighthouse-Onboarding-Queue"

  # EventBridge Rule: Stack Completion Notification
  # Sends CloudFormation status events to Lighthouse SQS queue
  CloudFormationCompleteRule:
    Type: AWS::Events::Rule
    Properties:
      Name: "NotifyLighthouseStep2Complete-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      Description: "Notifies Lighthouse when CloudFormation stack deployment completes"
      EventPattern:
        source:
          - "aws.cloudformation"
        detail-type:
          - "CloudFormation Stack Status Change"
        detail:
          stack-id:
            - prefix: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/"
      Targets:
        - Arn: "arn:aws:sqs:us-east-1:{{LIGHTHOUSE_ACCOUNT_ID}}:Lighthouse-Onboarding-Queue"
          Id: "LighthouseSQSQueue"
          RoleArn: !GetAtt LighthouseOptimizationNotifierRole.Arn
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              stackId: "$.detail.stack-id"
              statusDetails: "$.detail.status-details"
            InputTemplate: !Sub
              - |
                {
                  "source": "aws.cloudformation",
                  "account": <account>,
                  "region": <region>,
                  "time": <time>,
                  "stackId": <stackId>,
                  "statusDetails": <statusDetails>,
                  "templateVersion": "${TemplateVersion}",
                  "customerResourceId": "{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}",
                  "executionRoleArn": "${LighthouseExecutionRole.Arn}",
                  "readRoleArn": "${LighthouseReadRole.Arn}",
                  "majorTomReadRoleArn": "${LighthouseAgentReadRole.Arn}",
                  "bucketArn": "${BucketArn}",
                  "lighthouseOptimizationOUId": "${LighthouseOptimizationOU}",
                  "externalId": "{{EXTERNAL_ID}}",
                  "step": "2"
                }
              - TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]
                BucketArn: !If
                  - EnableCostAllocationBackfill
                  - !Sub "arn:${AWS::Partition}:s3:::${CURBucket}"
                  - ""

Outputs:
  CURBucketName:
    Condition: EnableCostAllocationBackfill
    Description: "S3 bucket where CUR 2.0 data is stored"
    Value: !Ref CURBucket
  CURBucketArn:
    Condition: EnableCostAllocationBackfill
    Description: "ARN of the S3 bucket where CUR 2.0 data is stored"
    Value: !Sub "arn:${AWS::Partition}:s3:::${CURBucket}"
  Cur20ExportName:
    Condition: EnableCostAllocationBackfill
    Description: "Name of the CUR 2.0 export"
    Value: !Ref Cur20Export
  LighthouseExecutionRoleArn:
    Description: "Cross-account role ARN for execution of cost optimization actions"
    Value: !GetAtt LighthouseExecutionRole.Arn
  LighthouseExecutionRoleName:
    Description: "Name of the cross-account Lighthouse execution role"
    Value: !Ref LighthouseExecutionRole
  LighthouseReadRoleArn:
    Description: "Read-only cross-account role ARN for cost analysis"
    Value: !GetAtt LighthouseReadRole.Arn
  LighthouseReadRoleName:
    Description: "Name of the read-only Lighthouse role"
    Value: !Ref LighthouseReadRole

  ###################
  # LighthouseAgent Roles  #
  ###################
  LighthouseAgentReadRoleArn:
    Description: "Read-only AI role ARN for cost analysis and monitoring"
    Value: !GetAtt LighthouseAgentReadRole.Arn
  LighthouseAgentReadRoleName:
    Description: "Name of the LighthouseAgent read-only role"
    Value: !Ref LighthouseAgentReadRole

  ###################################
  # Organizational Unit             #
  ###################################
  LighthouseOptimizationOUId:
    Description: "Organizational Unit ID for Lighthouse-managed accounts (exempted from Savings Plans SCP)"
    Value: !Ref LighthouseOptimizationOU
    Export:
      Name: !Sub "${AWS::StackName}-LighthouseOptimizationOUId"

  LighthouseOptimizationOUArn:
    Description: "ARN of the Lighthouse Optimization OU"
    Value: !GetAtt LighthouseOptimizationOU.Arn

  ###################################
  # Service Control Policies        #
  ###################################
  SavingsPlansSCPId:
    Description: "ID of the Savings Plans deny SCP policy (attached to organization root)"
    Value: !Ref LighthouseSavingsPlansDenyPolicy

  SavingsPlansSCPArn:
    Description: "ARN of the Savings Plans deny SCP policy"
    Value: !GetAtt LighthouseSavingsPlansDenyPolicy.Arn

  GovernanceSCPId:
    Description: "ID of the Lighthouse Governance deny SCP policy (attached to LighthouseOptimization OU)"
    Value: !Ref LighthouseGovernanceDenyPolicy

  GovernanceSCPArn:
    Description: "ARN of the Lighthouse Governance deny SCP policy"
    Value: !GetAtt LighthouseGovernanceDenyPolicy.Arn
