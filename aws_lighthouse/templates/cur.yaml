AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IMPORTANT: Deploy this stack in your AWS Organization Management (root) account in the us-east-1 region only.

  SUMMARY: This template enables Lighthouse to perform comprehensive cost analysis and optimization execution across your organization.

  ACTIONS (in order of execution):
  1. Enables AWS Organizations trusted access for Cost Optimization Hub and Compute Optimizer via Lambda function.
  2. Creates an S3 bucket (lighthouse-cur-data-{AccountId}) with encryption, versioning, and lifecycle policies.
  3. Configures CUR 2.0 export with hourly granularity in Parquet format to S3.
  4. Starts cost allocation tag backfill for the past 12 months.
  5. Deploys LighthouseExecutionRole to all member accounts via StackSet for organization-wide optimization.
  6. Creates LighthouseExecutionRole in management account with permissions for Savings Plans/RIs, Budgets, EventBridge, CloudWatch, Cost Optimization Hub, and AWS Organizations management.
  7. Creates EventBridge rule to notify Lighthouse upon stack completion.

Metadata:
  TemplateVersion: "0.1.26" # x-release-please-version

Mappings:
  TemplateConfig:
    Constants:
      Version: "0.1.26" # x-release-please-version

Rules:
  EnforceUsEast1:
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AWS::Region
            - us-east-1
        AssertDescription: "You must deploy to region us-east-1 only. Since Data exports is only available in us-east-1"

  EnforceManagementAccount:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals:
                - !Ref AWS::AccountId
                - "{{MANAGEMENT_ACCOUNT_ID}}"
            - Fn::Equals:
                - "{{MANAGEMENT_ACCOUNT_ID}}"
                - "SKIP"
        AssertDescription: "This stack must be deployed in the AWS Organization management account only. The current account does not match the expected management account."

Conditions:
  EnableCostAllocationBackfill:
    !Equals ["{{ENABLE_COST_ALLOCATION_BACKFILL}}", "true"]

Resources:
  LighthouseOnboardingLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "LighthouseOnboardingLambdaRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      Description: "Used by Lighthouse to enable organization services. Must remain in place for Lighthouse to function correctly. Email support@aws-lighthouse.local for assistance."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: Onboarding
      Policies:
        - PolicyName: LighthouseOnboardingLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ce:StartCostAllocationTagBackfill
                  - ce:UpdateCostAllocationTagsStatus
                  - ce:ListCostAllocationTagBackfillHistory
                  - ce:ListCostAllocationTags
                  - cost-optimization-hub:UpdateEnrollmentStatus
                  - cost-optimization-hub:ListEnrollmentStatuses
                  - compute-optimizer:UpdateEnrollmentStatus
                Resource: "*"
              # Service-Linked Role creation for Cost Optimization Hub and Compute Optimizer
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource:
                  - "arn:aws:iam::*:role/aws-service-role/cost-optimization-hub.bcm.amazonaws.com/AWSServiceRoleForCostOptimizationHub"
                  - "arn:aws:iam::*:role/aws-service-role/compute-optimizer.amazonaws.com/AWSServiceRoleForComputeOptimizer"
                Condition:
                  StringLike:
                    "iam:AWSServiceName":
                      - "cost-optimization-hub.bcm.amazonaws.com"
                      - "compute-optimizer.amazonaws.com"
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:EnableAWSServiceAccess
                  - organizations:EnablePolicyType
                  - organizations:ListRoots
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "*"
              # Permissions for deleting Step 1 stack
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/lighthouse-customer-step-1-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}/*"
              # Permissions to delete Step 1 StackSet
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStackSet
                  - cloudformation:DeleteStackInstances
                  - cloudformation:DescribeStackSet
                  - cloudformation:DescribeStackSetOperation
                  - cloudformation:ListStackInstances
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stackset/Lighthouse-CostEstimations-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}:*"
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStackInstances
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation::${AWS::AccountId}:stackset-target/Lighthouse-CostEstimations-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}:*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-ManagedPolicy"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}::type/resource/AWS-IAM-Role"
              # Permissions to delete Step 1 EventBridge rule
              - Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/NotifyLighthouseStep1Complete-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
              # Permissions to delete Step 1 IAM resources
              - Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LighthouseEstimationsReadRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LighthouseEstimationsNotifierRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/EnableStackSetsLambdaRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
              - Effect: Allow
                Action:
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:ListPolicyVersions
                  - iam:DeletePolicyVersion
                  - iam:ListEntitiesForPolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/LighthouseSavingsEstimationReadOnlyPolicy-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/LighthouseEstimationsDataProtectionPolicy-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/LighthouseEstimationsCustomReadPolicy-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
              # Permissions to delete Step 1 Lambda
              - Effect: Allow
                Action:
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:EnableStackSets-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"

  EnableOrgServicesLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda function to enable Organization services access (enables SCPs, Cost Optimization Hub, Compute Optimizer)"
      FunctionName: EnableOrgServices-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LighthouseOnboardingLambdaRole.Arn
      Timeout: 900
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          from botocore.exceptions import ClientError

          def enable_coh(orgs, max_retries=3):
              # 1. Enable Service Access
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='cost-optimization-hub.bcm.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for Cost Optimization Hub")
                  time.sleep(5)
              except ClientError as e:
                  print(f"Skipped enabling AWS Organizations Service Access for Cost Optimization Hub: {e}")

              # 2. Update Enrollment with retry logic
              cost_hub = boto3.client("cost-optimization-hub")
              last_error = None
              for attempt in range(max_retries):
                  try:
                      cost_hub.update_enrollment_status(status='Active', includeMemberAccounts=True)
                      print("Enabled Cost Optimization Hub Enrollment (Opt-In)")
                      return
                  except Exception as e:
                      last_error = e
                      print(f"Attempt {attempt + 1}/{max_retries} failed to enable Cost Optimization Hub: {e}")
                      if attempt < max_retries - 1:
                          sleep_time = 5 * (attempt + 1)
                          print(f"Retrying in {sleep_time} seconds...")
                          time.sleep(sleep_time)
              print(f"Failed to enable Cost Optimization Hub after {max_retries} attempts")
              raise last_error

          def enable_compute_optimizer(orgs, max_retries=3):
              # 1. Enable Service Access
              try:
                  orgs.enable_aws_service_access(ServicePrincipal='compute-optimizer.amazonaws.com')
                  print("Enabled AWS Organizations Service Access for Compute Optimizer")
                  time.sleep(5)
              except ClientError as e:
                  print(f"Skipped enabling AWS Organizations Service Access for Compute Optimizer: {e}")

              # 2. Update Enrollment with retry logic
              co_client = boto3.client("compute-optimizer")
              last_error = None
              for attempt in range(max_retries):
                  try:
                      co_client.update_enrollment_status(status='Active', includeMemberAccounts=True)
                      print("Enabled Compute Optimizer Enrollment (Opt-In)")
                      return
                  except Exception as e:
                      last_error = e
                      print(f"Attempt {attempt + 1}/{max_retries} failed to enable Compute Optimizer: {e}")
                      if attempt < max_retries - 1:
                          sleep_time = 5 * (attempt + 1)
                          print(f"Retrying in {sleep_time} seconds...")
                          time.sleep(sleep_time)
              print(f"Failed to enable Compute Optimizer after {max_retries} attempts")
              raise last_error

          def enable_scps(orgs, root_id, max_attempts=3):
              """Enable Service Control Policies in the organization with retry logic"""
              last_error = None

              for attempt in range(max_attempts):
                  try:
                      orgs.enable_policy_type(
                          RootId=root_id,
                          PolicyType='SERVICE_CONTROL_POLICY'
                      )
                      print(f"Enabled Service Control Policies (SCPs) on attempt {attempt + 1}")
                      # Wait for AWS Organizations to propagate the policy type enablement
                      print("Waiting for SCP policy type propagation...")
                      time.sleep(5)
                      return
                  except ClientError as e:
                      if 'PolicyTypeAlreadyEnabledException' in str(e):
                          print("Service Control Policies already enabled")
                          return

                      last_error = e
                      error_code = e.response.get('Error', {}).get('Code', 'Unknown')
                      print(f"Attempt {attempt + 1}/{max_attempts} failed to enable SCPs: [{error_code}] {e}")

                      if attempt < max_attempts - 1:
                          wait_time = 2 ** attempt  # Exponential backoff: 1s, 2s, 4s
                          print(f"Retrying in {wait_time} seconds...")
                          time.sleep(wait_time)

              # All retries exhausted
              error_msg = (
                  f"Failed to enable SCPs after {max_attempts} attempts. "
                  f"Verify organization has 'All Features' enabled and you have "
                  f"organizations:EnablePolicyType permission. Last error: {last_error}"
              )
              print(f"Error: {error_msg}")
              raise Exception(error_msg)

          def get_organization_root_id(orgs):
              """Fetch the Organization Root ID using list_roots API."""
              roots = orgs.list_roots()['Roots']
              if not roots:
                  raise Exception("No Organization Roots found. Ensure this is the management account.")
              return roots[0]['Id']

          def handler(event, context):
              try:
                  response_data = {}
                  orgs = boto3.client("organizations")

                  if event['RequestType'] in ['Create', 'Update']:
                      # Wait for IAM policy propagation on first deploy
                      time.sleep(10)

                      if orgs.describe_organization()['Organization']['FeatureSet'] != 'ALL':
                          raise Exception("Organization must have 'All Features' enabled.")

                      # 1. Enable & Verify Cost Optimization Hub
                      enable_coh(orgs)

                      # 2. Enable & Verify Compute Optimizer
                      enable_compute_optimizer(orgs)

                      # 3. Fetch Organization Root ID (needed for SCP and StackSet deployment)
                      org_root_id = get_organization_root_id(orgs)
                      print(f"Organization Root ID: {org_root_id}")
                      response_data['OrganizationRootId'] = org_root_id

                      # 4. Enable Service Control Policies
                      enable_scps(orgs, org_root_id)
                  else:
                      # For Delete operations, still need to fetch root ID for response
                      org_root_id = get_organization_root_id(orgs)
                      response_data['OrganizationRootId'] = org_root_id

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
              except Exception as e:
                  print(f"Unexpected Error in EnableOrgServices: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom Resource: Enable Organization Services
  # Triggers Lambda to enable Cost Optimization Hub and Compute Optimizer
  EnableOrgServices:
    Type: Custom::EnableOrgServices
    Properties:
      ServiceToken: !GetAtt EnableOrgServicesLambda.Arn
      # Force re-execution on template updates by including version
      TemplateVersion: !FindInMap [TemplateConfig, Constants, Version]

  # Lambda Function: Delete Step 1 Stack
  # Deletes the Step 1 stack after Step 2 deployment completes
  DeleteStep1StackLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Lambda function to delete Step 1 stack"
      FunctionName: DeleteStep1Stack-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LighthouseOnboardingLambdaRole.Arn
      Timeout: 60
      Architectures:
        - arm64
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError

          STACK_NAME = "lighthouse-customer-step-1-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"

          def handler(event, context):
              print(f"Received event: {event}")

              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      cf_client = boto3.client('cloudformation')

                      # Check if stack exists
                      try:
                          cf_client.describe_stacks(StackName=STACK_NAME)
                      except ClientError as e:
                          if 'does not exist' in str(e):
                              print(f"Stack {STACK_NAME} not found, nothing to delete")
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                              return
                          raise

                      # Delete the stack - CloudFormation handles StackSet cleanup
                      cf_client.delete_stack(StackName=STACK_NAME)
                      print(f"Delete initiated for stack {STACK_NAME}")

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  # Custom Resource: Delete Step 1 Stack
  # Triggers after Step 2 deployment completes to clean up Step 1 resources
  DeleteStep1Stack:
    Type: Custom::DeleteStep1Stack
    DependsOn:
      - SubAccountStackSet
      - LighthouseExecutionRole
    Properties:
      ServiceToken: !GetAtt DeleteStep1StackLambda.Arn

  # Organizational Unit: Lighthouse Optimization
  # Accounts in this OU are exempted from Savings Plans restrictions
  # Provides organizational boundary for cost optimization governance
  LighthouseOptimizationOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: "LighthouseOptimization-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      ParentId: !GetAtt EnableOrgServices.OrganizationRootId
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: CostOptimization
        - Key: ManagedBy
          Value: CloudFormation

  # Service Control Policy: Savings Plans Restriction
  # Denies all Savings Plans write operations except for:
  #   1. LighthouseExecutionRole (works from any account)
  #   2. Any principal in LighthouseOptimization OU (organizational boundary)
  # Applies at organization root level to enforce governance across all accounts
  LighthouseSavingsPlansDenyPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: LighthouseSavingsPlansDenyPolicy-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}
      Description: "Denies Savings Plans write operations except LighthouseExecutionRole and accounts in LighthouseOptimization OU. Managed by Lighthouse."
      Content:
        Version: "2012-10-17"
        Statement:
          # Deny if NOT using LighthouseExecutionRole (regardless of OU)
          - Sid: DenySavingsPlansIfNotUsingLighthouseRole
            Effect: Deny
            Action:
              - savingsplans:CreateSavingsPlan
              - savingsplans:DeleteQueuedSavingsPlan
              - savingsplans:ReturnSavingsPlan
              - savingsplans:TagResource
              - savingsplans:UntagResource
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn: arn:aws:iam::*:role/LighthouseExecutionRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}

          # Deny if NOT in LighthouseOptimization OU (regardless of role)
          - Sid: DenySavingsPlansIfNotInLighthouseOU
            Effect: Deny
            Action:
              - savingsplans:CreateSavingsPlan
              - savingsplans:DeleteQueuedSavingsPlan
              - savingsplans:ReturnSavingsPlan
              - savingsplans:TagResource
              - savingsplans:UntagResource
            Resource: "*"
            Condition:
              ForAllValues:StringNotLike:
                aws:PrincipalOrgPaths:
                  - !Sub "o-*/r-*/${LighthouseOptimizationOU}/*"
                  - !Sub "o-*/r-*/${LighthouseOptimizationOU}/"
      TargetIds:
        - !GetAtt EnableOrgServices.OrganizationRootId
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: SavingsPlansRestriction

  # Service Control Policy: Lighthouse Governance - Complete Lockdown
  # Denies ALL resource creation and IAM management for accounts in LighthouseOptimization OU
  # LighthouseExecutionRole, AWS service-linked roles, and LighthousePoolAccountTransferRole exempted
  # Creates frozen sandbox environment for Lighthouse-only operations
  LighthouseGovernanceDenyPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Type: SERVICE_CONTROL_POLICY
      Name: LighthouseGovernanceDenyPolicy-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}
      Description: "Complete account lockdown for LighthouseOptimization OU. Only LighthouseExecutionRole can create resources or manage IAM. AWS services and users are blocked. Managed by Lighthouse."
      Content:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyOrgAndAccountActions
            Effect: Deny
            Action:
              - organizations:LeaveOrganization
              - organizations:RemoveAccountFromOrganization
              - account:CloseAccount
              - account:EnableRegion
              - account:DisableRegion
              - iam:CreateUser
              - iam:CreateAccessKey
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/LighthouseExecutionRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
                  - !Sub "arn:${AWS::Partition}:iam::*:role/aws-service-role/*"
                  - !Sub "arn:${AWS::Partition}:iam::*:role/LighthousePoolAccountTransferRole"

          - Sid: DenyResourceCreation
            Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:CreateVpc
              - ec2:CreateSubnet
              - ec2:CreateVolume
              - ec2:CreateSecurityGroup
              - lambda:CreateFunction
              - s3:CreateBucket
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - dynamodb:CreateTable
              - ecs:CreateCluster
              - eks:CreateCluster
              - cloudwatch:PutMetricAlarm
              - sns:CreateTopic
              - sqs:CreateQueue
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/LighthouseExecutionRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"

          - Sid: DenySecurityTampering
            Effect: Deny
            Action:
              - guardduty:DeleteDetector
              - config:DeleteConfigRule
              - config:StopConfigurationRecorder
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - securityhub:DisableSecurityHub
            Resource: "*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:${AWS::Partition}:iam::*:role/LighthouseExecutionRole-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      TargetIds:
        - !Ref LighthouseOptimizationOU
      Tags:
        - Key: OwnedBy
          Value: Lighthouse
        - Key: Purpose
          Value: GovernanceControl

  # S3 Bucket for CUR 2.0 Data
  # Stores hourly Cost and Usage Report exports in Parquet format
  # with encryption, versioning, and 365-day lifecycle policy
  CURBucket:
    Type: AWS::S3::Bucket
    Condition: EnableCostAllocationBackfill
    Properties:
      BucketName: "lighthouse-cur-data-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 30
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - { ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }

  # S3 Bucket Policy for CUR Data
  # Allows BCM Data Exports service to write CUR 2.0 data
  # Roles access bucket via IAM policies (ReadOnlyAccess + LighthouseDataProtectionPolicy)
  CURBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableCostAllocationBackfill
    Properties:
      Bucket: !Ref CURBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Services: BCM Data Exports
          - Sid: AllowBCMDataExportsPut
            Effect: Allow
            Principal: { Service: bcm-data-exports.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CURBucket}/*"
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              StringLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*"

          # Services: BCM Data Exports
          - Sid: AllowBCMDataExportsBucketMeta
            Effect: Allow
            Principal: { Service: bcm-data-exports.amazonaws.com }
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketPolicy
              - s3:GetBucketLocation
              - s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::${CURBucket}"
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              StringLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*"

  # BCM Data Export (CUR 2.0)
  # Configures hourly cost and usage data export with resource-level detail
  # Outputs Parquet files to CURBucket for analysis by Lighthouse
  Cur20Export:
    Type: AWS::BCMDataExports::Export
    Condition: EnableCostAllocationBackfill
    DependsOn: CURBucketPolicy
    Properties:
      Export:
        Name: "lighthouse-cur-data-{{LIGHTHOUSE_CUSTOMER_RESOURCE_ID}}"
        Description: "CUR 2.0 export to S3 (Parquet), hourly with resource IDs"
        DataQuery:
          QueryStatement: |
            SELECT bill_bill_type,
              bill_billing_entity,
              bill_billing_period_end_date,
              bill_billing_period_start_date,
              bill_invoice_id,
              bill_invoicing_entity,
              bill_payer_account_id,
              bill_payer_account_name,
              cost_category,
              discount,
              discount_bundled_discount,
              discount_total_discount,
              identity_line_item_id,
              identity_time_interval,
              line_item_availability_zone,
              line_item_blended_cost,
              line_item_blended_rate,
              line_item_currency_code,
              line_item_legal_entity,
              line_item_line_item_description,
              line_item_line_item_type,
              line_item_net_unblended_cost,
              line_item_net_unblended_rate,
              line_item_normalization_factor,
              line_item_normalized_usage_amount,
              line_item_operation,
              line_item_product_code,
              line_item_resource_id,
              line_item_tax_type,
              line_item_unblended_cost,
              line_item_unblended_rate,
              line_item_usage_account_id,
              line_item_usage_account_name,
              line_item_usage_amount,
              line_item_usage_end_date,
              line_item_usage_start_date,
              line_item_usage_type,
              line_item_user_identifier,
              pricing_currency,
              pricing_lease_contract_length,
              pricing_offering_class,
              pricing_public_on_demand_cost,
              pricing_public_on_demand_rate,
              pricing_purchase_option,
              pricing_rate_code,
              pricing_rate_id,
              pricing_term,
              pricing_unit,
              product,
              product_comment,
              product_fee_code,
              product_fee_description,
              product_from_location,
              product_from_location_type,
              product_from_region_code,
              product_instance_family,
              product_instance_type,
              product_instancesku,
              product_location,
              product_location_type,
              product_operation,
              product_pricing_unit,
              product_product_family,
              product_region_code,
